class RNG {
  constructor(seed){ this.s = ((seed ^ 0x9e3779b9) >>> 0) || 1 }
  next(){ this.s ^= this.s<<13; this.s ^= this.s>>>17; this.s ^= this.s<<5; return (this.s>>>0)/0x100000000 }
  pick(a){ return a[Math.floor(this.next()*a.length)] }
  int(lo,hi){ return lo+Math.floor(this.next()*(hi-lo+1)) }
  shuffle(a){ const b=[...a]; for(let i=b.length-1;i>0;i--){const j=Math.floor(this.next()*(i+1));[b[i],b[j]]=[b[j],b[i]]} return b }
}

═══════════════════════════════════════════════════════════ */
const PL_STOP = new Set('a i w z na do że się jest to nie jak ale czy przez po przy od za bez nad pod przed między który która które oraz ten ta ze do'.split(' '));
const EN_STOP = new Set('a an the and or but in on at to for of with by from as into that this is are was were be been have has had do does did will would could should may might not no it its the'.split(' '));

function extractKeywords(text) {
  const tokens = text.toLowerCase()
    .replace(/[^\w\sąćęłńóśźżàâäéèêëïîôùûüÿæœ]/g,' ')
    .split(/\s+/)
    .filter(w => w.length > 3 && !PL_STOP.has(w) && !EN_STOP.has(w));
  // deduplicate
  const seen = new Set();
  return tokens.filter(w => { if(seen.has(w)) return false; seen.add(w); return true; }).slice(0,8);
}

/* ═══════════════════════════════════════════════════════════
   INJECT keyword into a template line
═══════════════════════════════════════════════════════════ */
function inject(line, kw) {
  if(!line.includes('[KW]')) return line;
  // Replace first [KW] with kw, second [KW] (if any) with kw too
  return line.replace(/\[KW\]/g, kw);
}

function generateStyle({ genres, mood, language, structure, rng }) {
  const primaryGenre = genres.length ? genres[0] : 'Polish Rap';
  const modifierGenre = genres.length > 1 ? genres[1] : null;
  const gd = GENRE_DATA[primaryGenre] || GENRE_DATA['Polish Rap'];
  const md = MOOD_MODS[mood] || MOOD_MODS['dark'];

  const bpm = `${rng.int(gd.bpmLo, Math.round((gd.bpmLo+gd.bpmHi)/2))}–${rng.int(Math.round((gd.bpmLo+gd.bpmHi)/2), gd.bpmHi)} BPM`;
  const key = `${rng.pick(gd.keys)}, ${rng.pick(gd.modes)}`;
  const vocal = rng.pick(gd.vocal);
  const instr = rng.pick(gd.instr);
  const prod = rng.pick(gd.prod);
  const arc = rng.pick(gd.arc);

  let genreStr = primaryGenre;
  if(modifierGenre && modifierGenre !== primaryGenre) genreStr += `, ${modifierGenre} elements`;

  let langNote = '';
  if(language === 'polish') langNote = 'Polish-language lyrics, delivery in Polish';
  else if(language === 'bilingual') langNote = 'bilingual Polish/English — Polish verses, English hook';
  else langNote = 'English-language delivery';

  const parts = [
    genreStr,
    bpm,
    key,
    `${md.adj} emotional register`,
    vocal,
    instr,
    md.textureMod,
    prod,
    `${md.arcPfx} ${arc}`,
    langNote,
  ];

  let style = parts.join('; ');
  if(style.length > 899) style = style.slice(0,896) + '...';
  return style;
}

function pickLine(pool, kw, rng) {
  const line = rng.pick(pool);
  return kw ? inject(line, kw) : line.replace(/\[KW\] ?—? ?/g,'').replace(/^ ?—? ?/, '').trim() || line;
}

function makeVerseLines(count, lang, reg, keywords, rng, useAna) {
  const pool = lang === 'english' ? EN[reg]?.verse : PL[reg]?.verse;
  if(!pool) return [];
  const kws = keywords.length ? rng.shuffle(keywords) : ['—'];
  const lines = [];
  let kwIdx = 0;
  let insertedAna = false;

  // possibly insert one anadiplosis pair
  const anaPairs = lang === 'english' ? ANA_EN : ANA_PL;
  const anaPair = useAna && rng.next() > 0.4 ? rng.pick(anaPairs) : null;
  const anaPos = anaPair ? rng.int(1, Math.max(1, count - 3)) : -1;

  for(let i = 0; i < count; i++) {
    if(anaPair && i === anaPos && !insertedAna) {
      const kw = kws[kwIdx % kws.length];
      lines.push(inject(anaPair[0], kw));
      lines.push(inject(anaPair[1], kw));
      kwIdx++;
      i++; // consumed two lines
      insertedAna = true;
      continue;
    }
    const kw = kws[kwIdx % kws.length];
    const usedPool = pool.filter(l => !lines.includes(inject(l, kw)));
    const src = usedPool.length ? usedPool : pool;
    const ln = rng.pick(src);
    lines.push(inject(ln, kw));
    kwIdx++;
  }
  return lines.slice(0, count);
}

function makeHookLines(count, lang, reg, keywords, rng) {
  const pool = lang === 'english' ? EN[reg]?.hook : PL[reg]?.hook;
  if(!pool) return [];
  const kw = keywords.length ? rng.pick(keywords) : '';
  const base = kw ? inject(rng.pick(pool), kw) : rng.pick(pool).replace(/\[KW\]/g,'—');
  const lines = [base];
  // repeat or add variations
  while(lines.length < count) {
    const extra = pool.filter(l => !lines.map(x=>x).includes(l.replace('[KW]',kw)));
    const next = extra.length ? inject(rng.pick(extra), kw) : lines[0];
    lines.push(next);
  }
  return lines.slice(0,count);
}

function makeBridgeLines(count, lang, reg, keywords, rng) {
  const pool = lang === 'english' ? EN[reg]?.bridge : PL[reg]?.bridge;
  if(!pool || !pool.length) return makeHookLines(count, lang, reg, keywords, rng);
  const kw = keywords.length ? rng.pick(keywords) : '';
  const lines = [];
  for(let i=0;i<count;i++){
    const unused = pool.filter(l=>!lines.includes(inject(l,kw)));
    const src = unused.length ? unused : pool;
    lines.push(inject(rng.pick(src), kw));

  return lines.slice(0,count);
}

  } else {
    const opts = [
      kw ? `(${kw} — ostatnie słowo, bez rozwiązania)` : '(bez rozwiązania — groove zanika)',
      kw ? `${kw}.` : '—',
      '(cisza tu ma znaczenie)',
    ];
    return [rng.pick(opts)];
  }
}

/* ═══════════════════════════════════════════════════════════
   PICK REGISTER from notes/concept or randomise
═══════════════════════════════════════════════════════════ */
function detectRegister(text, rng) {
  const t = text.toLowerCase();
  if(/chirurg|szpital|hospital|medic|biops|morfolog|skalpel|anestez|diagnoz|pacjen|lekar|krew|blood|wound|surgery/.test(t)) return 'medical';
  if(/chemic|reakcja|reaction|katali|stężen|roztwor|solution|kwas|acid|izotop|destyl|dissolv/.test(t)) return 'chemical';
  if(/gotow|gotuj|kuchn|kitchen|recipe|przepis|redukcj|smak|taste|flavor|cuisine|marynata|ferment|distil/.test(t)) return 'culinary';
  return rng.pick(['medical','chemical','culinary']);
}

/* ═══════════════════════════════════════════════════════════
   GENERATE LYRICS
═══════════════════════════════════════════════════════════ */
function generateLyrics({ concept, genres, language, structure, notes, rng }) {
  const allText = concept + ' ' + notes;
  const keywords = extractKeywords(allText);
  const reg = detectRegister(allText, rng);

  // Determine which language pool to use
  // bilingual: verses Polish, hooks English
  const verseLang  = language === 'english' ? 'english' : 'polish';
  const hookLang   = language === 'bilingual' ? 'english' : verseLang;

  const sections = STRUCT_DEFS[structure] || STRUCT_DEFS['rap-standard'];
  const output = [];

  sections.forEach((sec, idx) => {
    const tag = sec.cue ? `[${sec.tag} - ${sec.cue}]` : `[${sec.tag}]`;
    output.push('');
    output.push(tag);

    let lines = [];
    switch(sec.type) {
      case 'verse':
        lines = makeVerseLines(sec.lines, verseLang, reg, keywords, rng, idx < 2);
        break;
      case 'hook':
      case 'chorus':
      case 'refrain':
        lines = makeHookLines(sec.lines, hookLang, reg, keywords, rng);
        break;
      case 'bridge':
        lines = makeBridgeLines(sec.lines, verseLang, reg, keywords, rng);
        break;
      case 'prechorus':
        lines = makePreChorusLines(sec.lines, verseLang, reg, keywords, rng);
        break;
      case 'intro':
        lines = makeIntroLines(sec.lines, verseLang, keywords, rng);
        break;
      case 'outro':
        lines = makeOutroLines(sec.lines, verseLang, reg, keywords, rng);
        break;
      default:
        lines = makeVerseLines(sec.lines, verseLang, reg, keywords, rng, false);
    }

    output.push(...lines);
  });

  return output.join('\n').replace(/^\n/, '').trim();
}

/* ═══════════════════════════════════════════════════════════
   TITLE GENERATOR
═══════════════════════════════════════════════════════════ */
function generateTitle({ concept, language, rng }) {
  const kws = extractKeywords(concept);
  const kw = kws.length ? rng.pick(kws) : '';

  if(language === 'english') {
    const pats = [
      kw ? `Residual ${kw.charAt(0).toUpperCase()+kw.slice(1)}` : 'No Clean Margins',
      kw ? `${kw.charAt(0).toUpperCase()+kw.slice(1)} Protocol` : 'Controlled Exposure',
      kw ? `Half-Life of ${kw.charAt(0).toUpperCase()+kw.slice(1)}` : 'Saturated',
      kw ? `${kw.charAt(0).toUpperCase()+kw.slice(1)} at Saturation` : 'Phantom Signal',
      kw ? `The ${kw.charAt(0).toUpperCase()+kw.slice(1)} Procedure` : 'Contraindicated',
    ];
    return rng.pick(pats);
  }
  if(language === 'bilingual') {
    const pats = [
      kw ? `${kw.charAt(0).toUpperCase()+kw.slice(1)} / No Antidote` : 'Bez Antidotum / No Antidote',
      kw ? `Stężenie ${kw.charAt(0).toUpperCase()+kw.slice(1)}` : 'Saturated',
      kw ? `${kw.charAt(0).toUpperCase()+kw.slice(1)} — Half-Life` : 'Redukcja / Reduction',
    ];
    return rng.pick(pats);
  }
  // Polish
  const cap = kw ? kw.charAt(0).toUpperCase()+kw.slice(1) : '';
  const pats = [
    cap ? `Stężenie ${cap}` : 'Stężenie Bez Nazwy',
    cap ? `Morfologia ${cap}` : 'Morfologia Wyników',
    cap ? `Redukcja ${cap}` : 'Redukcja Do Esencji',
    cap ? `Preparat ${cap}` : 'Preparat Anonimowy',
    cap ? `${cap} W Roztworze` : 'W Roztworze Przesyconym',
    cap ? `Protokół ${cap}` : 'Protokół Bez Numeru',
    cap ? `Półokres ${cap}` : 'Półokres Nieskończoności',
    cap ? `${cap} — Bez Antidotum` : 'Bez Antidotum',
  ];
  return rng.pick(pats);
}

/* ═══════════════════════════════════════════════════════════
   MASTER GENERATOR
═══════════════════════════════════════════════════════════ */
function generate({ concept, genres, mood, language, structure, notes }) {
  const seed = Date.now() ^ (Math.random() * 0x7fffffff | 0);
  const rng = new RNG(seed);

  const title  = generateTitle({ concept, language, rng });
  const style  = generateStyle({ genres, mood, language, structure, rng });
  const lyrics = generateLyrics({ concept, genres, language, structure, notes, rng });

  return { title, style, lyrics };
}

/* ═══════════════════════════════════════════════════════════
   UI CONSTANTS
═══════════════════════════════════════════════════════════ */
const GENRES = [
  'Polish Rap','Dark R&B','Trap','Miami Bass',
  'Deep Dubstep','Wave','Phonk','Instrumental Hip Hop',

const MOODS = [

/* ═══════════════════════════════════════════════════════════
   COMPONENTS
═══════════════════════════════════════════════════════════ */
function CopyButton({ text, label }) {
  const [ok, setOk] = useState(false);
  const handle = async () => {
    try { await navigator.clipboard.writeText(text); }
    catch { const el=document.createElement('textarea');el.value=text;el.style.cssText='position:fixed;opacity:0';document.body.appendChild(el);el.select();document.execCommand('copy');document.body.removeChild(el); }
    setOk(true);
    setTimeout(()=>setOk(false), 2000);
  };
  return <button onClick={handle} className={`copy-btn${ok?' copy-ok':''}`}>{ok?'✓ Copied':`Copy ${label}`}</button>;
}

function CharCounter({ text }) {
  const n = (text||'').length;
  const cls = n>870?'cc-bad':n>780?'cc-warn':'cc-ok';
  return <span className={`cc ${cls}`}>{n} / 900</span>;
}

/* ═══════════════════════════════════════════════════════════
   APP
═══════════════════════════════════════════════════════════ */
function App() {
  const [concept,   setConcept]   = useState('');
  const [genres,    setGenres]    = useState([]);
  const [mood,      setMood]      = useState('dark');
  const [language,  setLanguage]  = useState('polish');
  const [structure, setStructure] = useState('rap-standard');
  const [notes,     setNotes]     = useState('');
  const [result,    setResult]    = useState(null);
  const [error,     setError]     = useState('');

  const toggleGenre = useCallback(g => setGenres(p => p.includes(g)?p.filter(x=>x!==g):[...p,g]), []);

  const run = useCallback(() => {
    if(!concept.trim()) { setError('Wpisz concept / idea.'); return; }
    setError('');
    try {
      const r = generate({ concept, genres, mood, language, structure, notes });
      setResult(r);
    } catch(e) {
      setError('Generator error: ' + e.message);
    }
  }, [concept, genres, mood, language, structure, notes]);

  return (
    <div className="app">
      <header className="hdr">
        <div className="hdr-in">
          <div className="logo">
            <span className="logo-icon">◈</span>
            <span className="logo-txt">SUNO FORGE</span>
            <span className="logo-sub">Local Generator</span>
          </div>
        </div>
      </header>

      <main className="main">
        {/* ── Form ── */}
        <section className="panel">
          <h2 className="panel-title">Brief</h2>

          <div className="fld">
            <label className="lbl">Concept / Idea *</label>
            <textarea value={concept} onChange={e=>setConcept(e.target.value)}
              placeholder="np. rozdarta lojalność między rodziną a karierą — przez pryzmat chirurgii: zszywanie rany kontra amputacja. Kto decyduje, która część umiera?"
              className="ta" rows={4} />
          </div>

          <div className="fld">
            <label className="lbl">Genre <span className="opt">(multi-select; blank = auto)</span></label>
            <div className="chips">
              {GENRES.map(g=>(
                <button key={g} type="button"
                  className={`chip${genres.includes(g)?' chip-on':''}`}
                  onClick={()=>toggleGenre(g)}>{g}</button>
              ))}
            </div>
          </div>

          <div className="fld-row">
            <div className="fld" style={{marginBottom:0}}>
              <label className="lbl">Mood</label>
              <select value={mood} onChange={e=>setMood(e.target.value)} className="sel">
                {MOODS.map(m=><option key={m.v} value={m.v}>{m.l}</option>)}
              </select>
            </div>
            <div className="fld" style={{marginBottom:0}}>
              <label className="lbl">Structure</label>
              <select value={structure} onChange={e=>setStructure(e.target.value)} className="sel">
                {STRUCTURES.map(s=><option key={s.id} value={s.id}>{s.l}</option>)}
              </select>
            </div>
          </div>

          <div className="fld" style={{marginTop:'16px'}}>
            <label className="lbl">Language</label>
            <div className="radio-g">
              {LANG_OPTS.map(l=>(
                <label key={l.v} className={`radio-lbl${language===l.v?' radio-on':''}`}>
                  <input type="radio" name="lang" value={l.v} checked={language===l.v}
                    onChange={()=>setLanguage(l.v)} className="radio-inp" />
                  <div className="radio-cnt">
                    <span className="radio-ttl">{l.t}</span>
                    <span className="radio-dsc">{l.d}</span>
                  </div>
                </label>
              ))}
            </div>
          </div>

          <div className="fld">
            <label className="lbl">Notes <span className="opt">(optional)</span></label>
            <textarea value={notes} onChange={e=>setNotes(e.target.value)}
              placeholder="np. rejestr apteczny, mostek jako spoken word, BPM ~88"
              className="ta" rows={2} />
          </div>

          {error && <div style={{marginTop:'12px',padding:'10px 14px',background:'var(--red-dim)',border:'1px solid var(--red)',borderRadius:'8px',color:'var(--red)',fontSize:'13px'}}>{error}</div>}

          <button onClick={run} className="gen-btn">◈ Generate</button>
        </section>

        {/* ── Output ── */}
        <section className="panel">
          <h2 className="panel-title">Output</h2>

          {!result && (
            <div className="empty">
              <span className="empty-icon">◈</span>
              <p>Fill the brief and hit <strong>Generate</strong>.<br/>
              No API key needed — runs entirely in the browser.<br/>
              <span style={{fontSize:'12px',color:'var(--tx-dim)'}}>Style and lyrics are separate copy targets for Suno's two fields.</span></p>
            </div>
          )}

          {result && (
            <div className="result">
              <div className="res-blk">
                <div className="res-hdr">
                  <span className="res-lbl">Title</span>
                  <CopyButton text={result.title} label="title" />
                </div>
                <div className="res-title">{result.title}</div>
              </div>

              <div className="res-blk">
                <div className="res-hdr">
                  <span className="res-lbl">Style of Music</span>
                  <div className="res-acts">
                    <CharCounter text={result.style} />
                    <CopyButton text={result.style} label="style" />
                  </div>
                </div>
                <p className="hint" style={{marginBottom:'8px'}}>→ Suno's <strong>Style of Music</strong> field</p>
                <pre className="res-txt">{result.style}</pre>
              </div>

              <div className="res-blk">
                <div className="res-hdr">
                  <span className="res-lbl">Lyrics</span>
                  <CopyButton text={result.lyrics} label="lyrics" />
                </div>
                <p className="hint" style={{marginBottom:'8px'}}>→ Suno's <strong>Lyrics</strong> field</p>
                <pre className="res-txt">{result.lyrics}</pre>
              </div>

              <button onClick={run} className="regen-btn">↺ Regenerate</button>
            </div>
          )}
        </section>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
